<!DOCTYPE html>
<html lang="en-IN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — Local Sole</title>
  <meta name="description" content="Meet an independent Bengaluru shoe shop: opening hours, address, pickup times and the full stock on the shelf.">
  <meta name="theme-color" content="#f6f3ec">
  <meta name="color-scheme" content="light dark">
  <link rel="canonical" href="https://localsole.in/shop.html">
  <link rel="icon" href="assets/images/icons/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Local Sole">
  <meta property="og:title" content="Shop — Local Sole">
  <meta property="og:description" content="An independent Bengaluru shoe shop on Local Sole.">
  <meta property="og:image" content="https://localsole.in/assets/images/shops/store-1.jpg">
  <meta property="og:url" content="https://localsole.in/shop.html">
  <meta property="og:locale" content="en_IN">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Shop — Local Sole">
  <meta name="twitter:description" content="An independent Bengaluru shoe shop on Local Sole.">
  <meta name="twitter:image" content="https://localsole.in/assets/images/shops/store-1.jpg">
  <link rel="preload" href="assets/fonts/instrument-serif-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/manrope-200800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animations.css">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("ls_theme_v1");
        var prefers = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = stored || (prefers ? "dark" : "light");
        document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
      } catch (e) { /* theme falls back to light */ }
    })();
  </script>
</head>
<body data-page="shop">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <div class="container">
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <a href="index.html">Home</a>
        <span aria-hidden="true" data-icon="chevronRight" data-size="12"></span>
        <a href="shops.html">Local shops</a>
        <span aria-hidden="true" data-icon="chevronRight" data-size="12"></span>
        <span aria-current="page">Shop</span>
      </nav>
      <div class="shop-banner" id="shopBanner"></div>
    </div>

    <div class="container">
      <div class="shop-profile">
        <div id="shopProfile"></div>
        <div id="shopInfo"></div>
      </div>
      <section class="shop-products" id="shopProducts" aria-labelledby="shopStock"></section>
    </div>

    <section class="nearby-shops" id="nearbyShops" aria-label="Nearby shops"></section>

    <section class="section section-alt" aria-labelledby="shopHelpTitle">
      <div class="container">
        <div class="section-head">
          <div class="section-head-text">
            <span class="eyebrow">Before you visit</span>
            <h2 id="shopHelpTitle">Not sure what you need?<span class="text-accent">.</span></h2>
            <p class="lede">Call the shop and describe the walk, the fit or the occasion. They'll tell you honestly whether they have the pair — or send you to a neighbour who does.</p>
          </div>
          <div class="row wrap">
            <a class="btn btn-dark" href="contact.html">Ask Local Sole</a>
            <a class="btn btn-outline" href="shops.html">Browse all shops</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <noscript>
    <div class="container section">
      <div class="empty-state">
        <h2>This shop needs JavaScript</h2>
        <p>Stock, opening hours and directions are loaded in your browser. Turn JavaScript on, or call the shop directly.</p>
      </div>
    </div>
  </noscript>

  <script src="data/seed.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/search.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/shops.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
