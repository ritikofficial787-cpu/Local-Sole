<head>
  <meta charset="utf-8">

  <meta name="description" content="Your Local Sole order is confirmed. See pickup details, delivery tracking and what happens next.">

  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex,nofollow">
  <link rel="canonical" href="https://localsole.in/order-confirmation.html">
  <link rel="icon" href="assets/images/icons/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Local Sole">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animations.css">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("ls_theme_v1");
        var prefers = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = stored || (prefers ? "dark" : "light");
        document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
      } catch (e) { /* theme falls back to light */ }
    })();
  </script>
</head>
<body data-page="confirmation">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <div id="orderConfirmation" aria-live="polite"></div>
  </main>

  <div id="site-footer"></div>

  <noscript>
    <div class="container section">
      <div class="empty-state">
        <h2>Your order details need JavaScript</h2>
        <p>Order confirmations are kept in your browser. Turn JavaScript on, or call the shop you ordered from via <a href="shops.html">the shops page</a>.</p>
      </div>
    </div>
  </noscript>

  <script src="data/seed.js"></script>

  <script src="js/cart.js"></script>

  <script src="js/checkout.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
