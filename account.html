<!DOCTYPE html>
<html lang="en-IN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your account — Local Sole</title>
  <meta name="description" content="Orders, addresses and profile for your Local Sole account. Track local pickup, reorder pairs and manage the details shops use to reach you.">
  <meta name="theme-color" content="#f6f3ec">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex,nofollow">
  <link rel="canonical" href="https://localsole.in/account.html">
  <link rel="icon" href="assets/images/icons/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Local Sole">
  <meta property="og:title" content="Your account — Local Sole">
  <meta property="og:description" content="Orders, addresses and profile.">
  <meta property="og:image" content="https://localsole.in/assets/images/banners/og-default.jpg">
  <meta property="og:url" content="https://localsole.in/account.html">
  <meta property="og:locale" content="en_IN">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="assets/fonts/instrument-serif-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/manrope-200800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animations.css">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("ls_theme_v1");
        var prefers = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = stored || (prefers ? "dark" : "light");
        document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
      } catch (e) { /* theme falls back to light */ }
    })();
  </script>
</head>
<body data-page="account">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="account-header" aria-labelledby="accountTitle">
      <div class="container">
        <nav class="breadcrumbs" aria-label="Breadcrumb" style="padding-bottom:16px">
          <a href="index.html">Home</a>
          <span aria-hidden="true" data-icon="chevronRight" data-size="12"></span>
          <span aria-current="page">Account</span>
        </nav>
        <span class="eyebrow">Your corner</span>
        <h1 class="display" id="accountTitle">Good to see you<span class="text-accent">.</span></h1>
        <p class="lede" style="max-width:55ch">Orders, pickup slots and the details our shops use to reach you. Everything stays on this device in the demo.</p>
      </div>
    </section>

    <div class="container account-layout">
      <aside class="account-aside" aria-label="Account navigation">
        <div class="account-user" id="accountUser"></div>
        <nav class="account-nav" id="accountNav"></nav>
      </aside>
      <div class="account-main" id="accountMain" aria-live="polite"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <noscript>
    <div class="container section">
      <div class="empty-state">
        <h2>Your account needs JavaScript</h2>
        <p>Orders and addresses are stored in your browser. Turn JavaScript on, or <a href="contact.html">contact a shop directly</a>.</p>
      </div>
    </div>
  </noscript>

  <script src="data/seed.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/search.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/account.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
